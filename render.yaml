services:
  - type: web
    name: good-job-radar
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    autoDeploy: true

  - type: web
    name: good-job-radar-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: good-job-radar-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://good-job-radar.onrender.com

databases:
  - name: good-job-radar-db
    databaseName: good_job_radar
    user: good_job_radar
    plan: free
    region: singapore
